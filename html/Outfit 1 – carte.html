<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outfit 1</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>

:root{
  --pink:#f48fb6; --block:#f7c9c7; --text:#222; --line:#e6e6e6; --card:#fff;
  --bg1:#f3c6dd; --bg2:#fbe9f1; --bg3:#e8a9cc;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --card:#fff; --text:#222; }
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}

body{
  font-family:'Roboto',system-ui,sans-serif;color:var(--text);
  display:flex;justify-content:center;align-items:center;min-height:100vh;padding:24px;
  background:
    radial-gradient(circle at 15% 20%,var(--bg3) 0 8%,transparent 30%),
    radial-gradient(circle at 85% 30%,var(--bg2) 0 12%,transparent 35%),
    radial-gradient(circle at 30% 85%,var(--bg2) 0 10%,transparent 35%),
    radial-gradient(circle at 80% 90%,var(--bg3) 0 8%,transparent 30%),
    var(--bg1);
}

.card{
  width:100%;max-width:340px;background:var(--card);border-radius:6px;
  padding:22px 14px 14px;box-shadow:0 4px 18px rgba(120,40,80,.18);
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  padding:0 8px;
  min-height:92px
}

h1{
  margin:0;
  font-size:2.3rem;
  font-weight:900;
  color:var(--pink);
  line-height:1
}

.star{
  width:38px;height:38px;
  fill:#f7d44c;cursor:pointer;
  transition:transform .15s
}

.star:hover{
  transform:scale(1.12)
}

.star.off{
  fill:#e5e0e3
}

h2{
  font-size:.72rem;
  font-weight:700;
  margin:0 0 6px 2px
}

.section{
  border-top:1px solid var(--line);
  padding-top:10px;
  margin-top:6px
}

.grid{
  display:grid;gap:5px;
  margin-bottom:12px
}

.grid div{
  background:var(--block);
  border-radius:2px
}

.clothes{
  grid-template-columns:1.9fr 1.4fr .9fr;
  grid-template-rows:1fr 1fr 1fr;
  height:190px
}

.clothes .a{
  grid-row:1/4
}

.clothes .b{
  grid-column:2;grid-row:1
}

.clothes .c{
  grid-column:2;
  grid-row:2/4
}

.clothes .d{
  grid-column:3;
  grid-row:1/3
}

.clothes .e{
  grid-column:3;
  grid-row:3
}

.beauty{
  grid-template-columns:1.5fr 1.5fr .9fr;
  grid-template-rows:1fr 1fr 1fr;
  height:190px
}
.beauty .a{
  grid-column:1;
  grid-row:1/3
}

.beauty .b{
  grid-column:2;grid-row:1/3
}

.beauty .c{
  grid-column:3;grid-row:1/2
}

.beauty .d{
  grid-column:1/3;
  grid-row:3
}

.beauty .e{
  grid-column:3;
  grid-row:2/4
}

.view{
  display:block;
  width:calc(100% - 8px);
  margin:6px auto 0;
  padding:11px;border:0;
  border-radius:3px;
  background:var(--pink);color:#fff;font:500 .72rem 'Roboto',sans-serif;cursor:pointer;
}

.view:hover{
  filter:brightness(.95)
}

.view:focus-visible,.star:focus-visible{
  outline:2px solid #c2417a;
  outline-offset:2px
}

</style>



</head>
<body>
<article class="card">
  <div class="head">
    <h1>Outfit 1</h1>
    <svg class="star" id="star" viewBox="0 0 24 24" role="button" tabindex="0" aria-label="Favori"><path d="M12 1.8l3 6.9 7.5.7-5.7 5 1.7 7.3L12 17.7 5.5 21.7l1.7-7.3-5.7-5 7.5-.7z"/></svg>
  </div>

  <section class="section">
    <h2>Clothes</h2>
    <div class="grid clothes"><div class="a"></div><div class="b"></div><div class="c"></div><div class="d"></div><div class="e"></div></div>
  </section>

  <section class="section">
    <h2>Makeup / Accessories / Hairstyle</h2>
    <div class="grid beauty"><div class="a"></div><div class="b"></div><div class="c"></div><div class="d"></div><div class="e"></div></div>
  </section>

  <button class="view" type="button">View</button>
</article>


<script>
const s=document.getElementById('star');
const t=()=>s.classList.toggle('off');
s.addEventListener('click',t);
s.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t()}});
</script>
</body>
</html>
